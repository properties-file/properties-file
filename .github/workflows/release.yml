name: Release

# The second half of the release flow. The first half, `npm run release` (see release/), pushes
# a release commit to `main` together with its `v<version>` tag; that tag starts this workflow,
# which tests the tagged commit, stages it on npm and creates the GitHub release. The version
# becomes public when a maintainer approves the staged version on npm.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# One release at a time: a running release is never cancelled, and `queue: max` keeps every
# waiting one (by default only the latest would be kept).
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  # The whole test workflow (its Node.js versions, plus Node.js 0.4.0), on the tagged commit.
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      actions: write

  # Builds the package and packs it, without the permissions to publish it.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The whole history, to check below that the tagged commit is on `main`. The token is not
      # kept in the git configuration: nothing after this step needs it (the repository is
      # public), and the steps below run every development dependency.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Without a dependency cache, as npm recommends for a workflow that publishes.
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # A tag is only released if it is `v` + the `package.json` version, a plain
      # major.minor.patch version (anything else would need an npm dist-tag other than
      # `latest`), on a commit that is part of `main`. These checks catch mistakes; they are
      # not what restricts who can publish (see "Releasing" in docs/CONTRIBUTING.md).
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="$(node --print "require('./package.json').name")"
          version="$(node --print "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag ($TAG) is not v + the package.json version ($version)."
            exit 1
          fi
          if ! printf '%s' "$version" | grep --quiet --extended-regexp '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$version is not a plain major.minor.patch version."
            exit 1
          fi
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The tagged commit is not part of the main branch."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Before the build, so that a version without a changelog entry stops here.
      - name: Read the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          npx tsx release/notes.ts "$VERSION" > "$RUNNER_TEMP/release/notes.md"

      # Builds what gets published, through the same gate as every other build.
      - name: Build
        run: npm run build

      # The build formats and fixes the sources before compiling them, and rewrites the size
      # badge of the README. `npm run release` only tags a commit on which the build changes
      # nothing, so a change here means that what was compiled is not what was tagged: stop.
      # The README is the exception, since its badge is measured again on this machine: it is
      # published as it was tagged.
      - name: Check that the build changed nothing
        run: |
          if ! git diff --quiet -- README.md; then
            echo "::warning::The build rewrote README.md. It is published as it was tagged."
            git checkout -- README.md
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The build changed or created the files listed in this step's log: what it compiled is not the tagged commit."
            exit 1
          fi

      # The exact archive that gets published: `<name>-<version>.tgz`.
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP/release"

      # `overwrite`, so that the job can run again when the whole workflow is re-run.
      - name: Upload the package and the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          overwrite: true

  # Stages on npm what the build job packed, once the tests pass, and creates the GitHub
  # release. This is the only job with the permissions to do so, and nothing from the
  # repository or its dependencies runs in it: it checks out nothing and installs nothing.
  publish:
    name: Publish
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trusted publisher on npmjs.com names this environment, whose rules (set up once, see
    # "Releasing" in docs/CONTRIBUTING.md) limit which tags may use it.
    environment: npm
    permissions:
      # Create the GitHub release.
      contents: write
      # npm trusted publishing: the job proves to npm which repository, workflow file and
      # environment it runs in with a short-lived OIDC token, so no npm token is stored. This
      # only works once the package lists them as a trusted publisher on npmjs.com (see
      # "Releasing" in docs/CONTRIBUTING.md).
      id-token: write
    env:
      NAME: ${{ needs.build.outputs.name }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the package and the release notes
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # Trusted publishing needs Node.js >= 22.14.0 and npm >= 11.5.1, staging npm >= 11.15.0.
      # Current Node.js 24 releases come with such an npm (the `.nvmrc` version, Node.js 22,
      # comes with npm 10, which has no `npm stage`).
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Staged, not published: the version only becomes public once a maintainer approves it
      # with two-factor authentication, which the summary of the run explains. Skipped when the
      # version is already on npm. Provenance is attached automatically by trusted publishing.
      # Verbose, because npm only says at that level why trusted publishing did not work.
      - name: Stage the version on npm
        run: |
          set -o pipefail
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION is already on npm, not staging it again."
            exit 0
          fi
          # With its leading "./": npm takes "release/<file>" for the GitHub repository of a
          # user named "release", and would fetch that instead of the file.
          archive="./release/$NAME-$VERSION.tgz"
          if ! npm stage publish "$archive" --ignore-scripts --loglevel verbose 2>&1 | tee stage.log; then
            echo "::error::npm did not stage $NAME@$VERSION: the log of this step says why. \`npm stage list $NAME\` shows whether the version is already staged; see \"When a run fails\" in docs/CONTRIBUTING.md."
            exit 1
          fi
          if ! grep --quiet --fixed-strings "+ $NAME@$VERSION (staged" stage.log; then
            echo "::error::npm staged something, but not $NAME@$VERSION: see the log of this step, and reject what was staged."
            exit 1
          fi
          stage_id="$(sed -n 's/.*(staged with id \([0-9a-fA-F-]*\)).*/\1/p' stage.log | tail -n 1)"
          shasum="$(sha1sum "$archive" | cut -d ' ' -f 1)"
          {
            echo "### $NAME@$VERSION is staged on npm: it is not public yet"
            echo
            echo "A maintainer of the package has to approve it with two-factor authentication, either:"
            echo
            echo "- on npmjs.com, in the **Staged Packages** tab (the staged files can be inspected there), or"
            echo "- with \`npm stage approve ${stage_id:-<stage-id>}\` (\`npm stage list $NAME\` lists what is staged)."
            echo
            echo "**Before approving, check that the staged version is the one this run built:** its shasum must be \`$shasum\` (npm shows it next to the staged version, and so does \`npm stage view ${stage_id:-<stage-id>}\`)."
            echo
            echo "\`npm view $NAME@$VERSION version\` prints the version once it is public."
          } >> "$GITHUB_STEP_SUMMARY"

      # Skipped when the release already exists, so that the job can be run again.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::The GitHub release $TAG already exists, not creating it again."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Release $VERSION" --notes-file release/notes.md
          fi
